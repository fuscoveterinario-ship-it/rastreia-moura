<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Órigo · Rastreabilidade e Certificação</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(typeof supabase==="undefined"){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>if(typeof QRCode==="undefined"){document.write('<script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"><\/script>');}</script>
<style>
  :root{
    --bone:#100D0B; --boneDeep:#1A1512; --ink:#F2E6CE; --inkSoft:#9A8B72;
    --cure:#C9A34E; --cureSoft:#E0C067; --moss:#5E7A46; --mossSoft:#7E9A60;
    --amber:#C9922E; --line:#2E2620; --paper:#191410;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bone);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
  .mono{font-family:'DM Mono',monospace}
  .serif{font-family:'Playfair Display',Georgia,serif}
  input{font-family:inherit}
  button{font-family:inherit;cursor:pointer}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-box{width:100%;max-width:400px}
  .login-head{text-align:center;margin-bottom:24px}
  .selo-login{width:150px;margin:0 auto 12px;display:block}
  .marca{font-family:'Playfair Display',serif;font-weight:800;color:var(--cure);letter-spacing:3px;font-size:26px}
  .marca-desc{color:var(--ink);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
  .marca-sub{color:var(--inkSoft);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-top:6px}
  .login-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px}
  .lbl{display:block;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--inkSoft);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
  .perfis{display:flex;gap:6px;margin-bottom:20px}
  .perfil-btn{flex:1;padding:10px 4px;background:none;border:1px solid var(--line);border-radius:5px;color:var(--inkSoft);font-size:12.5px;transition:.15s;text-align:center}
  .perfil-btn.on{background:var(--cure);border-color:var(--cure);color:#0A0806;font-weight:700}
  .perfil-desc{font-size:11px;color:var(--inkSoft);margin:-12px 0 18px;min-height:14px;font-style:italic}
  input.campo{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:5px;font-size:14px;background:#0F0C09;color:var(--ink);outline:none;margin-bottom:16px}
  input.campo:focus{border-color:var(--cure)}
  .btn-entrar{width:100%;background:var(--cure);color:#0A0806;border:none;padding:14px;border-radius:5px;font-weight:700;font-size:14px;letter-spacing:1px}
  .btn-entrar:disabled{opacity:.6}
  .erro{color:#E0876B;font-family:'DM Mono',monospace;font-size:12px;margin-top:12px;text-align:center}
  .esqueci{display:block;width:100%;text-align:center;background:none;border:none;color:var(--inkSoft);font-family:'DM Mono',monospace;font-size:12px;margin-top:14px}
  .login-foot{text-align:center;margin-top:18px;font-family:'DM Mono',monospace;font-size:10px;color:#6B6357}

  /* ---------- APP ---------- */
  #app{display:none;max-width:1040px;margin:0 auto;min-height:100vh}
  header{background:#0A0806;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line)}
  header .hl{display:flex;align-items:center;gap:12px}
  header .selo-h{width:42px;display:block}
  .htitle{font-family:'Playfair Display',serif;font-weight:800;letter-spacing:2px;font-size:16px;color:var(--cure)}
  .hsub{font-size:10px;color:var(--inkSoft);letter-spacing:.5px;text-transform:uppercase}
  .hright{display:flex;align-items:center;gap:14px}
  .huser{font-family:'DM Mono',monospace;font-size:11px;color:var(--inkSoft);text-align:right}
  .huser b{color:var(--ink);display:block;font-weight:500}
  .sair{background:none;border:1px solid var(--line);color:var(--inkSoft);font-family:'DM Mono',monospace;font-size:11px;padding:6px 12px;border-radius:4px}
  nav{display:flex;background:var(--boneDeep);border-bottom:1px solid var(--line);position:sticky;top:63px;z-index:29;overflow-x:auto}
  nav button{background:none;border:none;border-bottom:2px solid transparent;padding:15px 20px;font-size:14px;color:var(--inkSoft);white-space:nowrap}
  nav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--cure);background:var(--paper)}
  main{padding:26px 22px 70px}
  .eyebrow{font-family:'DM Mono',monospace;font-size:11px;color:var(--cure);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
  h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:22px}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px}
  .metric{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}
  .metric .v{font-family:'Playfair Display',serif;font-size:32px;font-weight:800;color:var(--cure)}
  .metric .l{font-family:'DM Mono',monospace;font-size:11px;color:var(--inkSoft);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

  .item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .item.gold{border-left:3px solid var(--cure)}
  .item.moss{border-left:3px solid var(--moss)}
  .nome{font-weight:700;font-size:16px;margin-bottom:4px}
  .meta{font-family:'DM Mono',monospace;font-size:12px;color:var(--inkSoft)}
  .tag{font-family:'DM Mono',monospace;font-size:10.5px;padding:4px 11px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .tag.ativa{background:var(--moss);color:var(--ink)}
  .tag.suspensa{background:var(--cure);color:#0A0806}
  .tag.processo{background:#5A4A2A;color:var(--cureSoft)}
  .status-sel{background:#0F0C09;border:1px solid var(--line);border-radius:5px;color:var(--ink);font-family:'DM Mono',monospace;font-size:12px;padding:7px 10px;outline:none;cursor:pointer}
  .status-sel:focus{border-color:var(--cure)}
  .chancela-acoes{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .qr-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:100;padding:20px}
  .qr-overlay.on{display:grid}
  .qr-modal{background:var(--paper);border:1px solid var(--cure);border-radius:12px;padding:28px;max-width:360px;width:100%;text-align:center}
  .qr-modal h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--cure);margin-bottom:4px}
  .qr-modal .qr-estab{font-family:'DM Mono',monospace;font-size:12px;color:var(--inkSoft);margin-bottom:20px}
  .qr-box{background:#fff;padding:16px;border-radius:8px;display:inline-block;margin-bottom:18px}
  .qr-box img,.qr-box canvas{display:block}
  .qr-cod{font-family:'DM Mono',monospace;font-size:13px;color:var(--cure);margin-bottom:16px}
  .qr-btns{display:flex;gap:10px}
  .qr-btns button,.qr-btns a{flex:1;padding:11px;border-radius:6px;font-family:'DM Mono',monospace;font-size:12px;text-decoration:none;text-align:center;border:1px solid var(--line);background:none;color:var(--ink)}
  .qr-btns .baixar{background:var(--cure);color:#0A0806;border:none;font-weight:700}
  .selo-wrap{position:relative;width:60px;flex-shrink:0}
  .selo-wrap img{width:100%;display:block}
  .selo-num{position:absolute;left:49.5%;top:85%;transform:translate(-50%,-50%);font-family:'Playfair Display',serif;font-weight:800;color:#2E1C0C;font-size:12px}
  .btn-ver{background:none;border:1px solid var(--line);border-radius:5px;padding:9px 14px;font-family:'DM Mono',monospace;font-size:12px;color:var(--ink);text-decoration:none;white-space:nowrap}
  .loading{color:var(--inkSoft);font-family:'DM Mono',monospace;font-size:13px;padding:40px;text-align:center}
  .vazio{color:var(--inkSoft);font-family:'DM Mono',monospace;font-size:13px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:8px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .btn-novo{background:var(--cure);color:#0A0806;border:none;padding:11px 18px;border-radius:6px;font-weight:700;font-size:13px;white-space:nowrap}
  .btn-link{background:none;border:none;color:var(--cure);font-family:'DM Mono',monospace;font-size:12px;margin-bottom:14px;padding:0}
  .form-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px;max-width:560px}
  .form-card label{display:block;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--inkSoft);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px;margin-top:16px}
  .form-card label:first-child{margin-top:0}
  .form-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:5px;font-size:14px;background:#0F0C09;color:var(--ink);outline:none}
  .form-card input:focus{border-color:var(--cure)}
  .btn-salvar{width:100%;background:var(--cure);color:#0A0806;border:none;padding:14px;border-radius:6px;font-weight:700;font-size:14px;letter-spacing:.5px;margin-top:24px}
  .btn-salvar:disabled{opacity:.5}
  .msg-ok{color:var(--mossSoft);font-family:'DM Mono',monospace;font-size:13px;margin-top:14px;text-align:center}
  .msg-erro{color:#E0876B;font-family:'DM Mono',monospace;font-size:13px;margin-top:14px;text-align:center}
  .acesso-bloco{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
  .acesso-titulo{font-family:'DM Mono',monospace;font-size:12px;color:var(--cure);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  .acesso-titulo span{color:var(--inkSoft);text-transform:none;letter-spacing:0}
  .acesso-desc{font-size:12px;color:var(--inkSoft);line-height:1.5;margin-bottom:8px}
  .metric.moss .v{color:var(--mossSoft)}
  .metric.cure .v{color:var(--cure)}
  .metric .v small{font-size:14px;color:var(--inkSoft);font-weight:400}
  .painel-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}
  .painel-titulo{font-family:'DM Mono',monospace;font-size:11px;color:var(--cure);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
  .linha-mini{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line)}
  .linha-mini:last-child{border-bottom:none}
  .carc-linha{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line)}
  .carc-linha:last-child{border-bottom:none}
  @media(max-width:640px){.grid-resumo{grid-template-columns:1fr !important}}
  .nota-chancela{background:rgba(201,163,78,.08);border:1px solid var(--line);border-left:3px solid var(--cure);border-radius:6px;padding:12px 14px;margin-bottom:18px;font-size:12.5px;color:var(--inkSoft);line-height:1.5;max-width:560px}
  .nota-chancela b{color:var(--cure)}
</style></head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="login-head">
      <img class="selo-login" id="seloLogin" alt="Órigo"/>
      <div class="marca">ÓRIGO</div>
      <div class="marca-desc">Rastreabilidade e Certificação</div>
      <div class="marca-sub">Controle de produção e rastreabilidade</div>
    </div>
    <div class="login-card">
      <span class="lbl">Entrar como</span>
      <div class="perfis" id="perfis">
        <button class="perfil-btn on" data-p="estabelecimento">Estabelecimento</button>
        <button class="perfil-btn" data-p="auditor">Auditor</button>
        <button class="perfil-btn" data-p="administrador">Administrador</button>
      </div>
      <div class="perfil-desc" id="perfilDesc">Opera os dados da própria charcutaria</div>
      <span class="lbl">Usuário, CPF ou e-mail</span>
      <input class="campo" id="email" type="email" placeholder="voce@charcutaria.com.br" autocomplete="username"/>
      <span class="lbl">Senha</span>
      <input class="campo" id="senha" type="password" placeholder="••••••••" autocomplete="current-password"/>
      <button class="btn-entrar" id="btnEntrar">ENTRAR</button>
      <div class="erro" id="erroLogin"></div>
      <button class="esqueci">Esqueci minha senha</button>
    </div>
    <div class="login-foot">Nenhum dado é acessível antes da identificação</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hl">
      <img class="selo-h" id="seloHeader" alt="Selo"/>
      <div>
        <div class="htitle">ÓRIGO</div>
        <div class="hsub" id="perfilLabel">Rastreabilidade e Certificação</div>
      </div>
    </div>
    <div class="hright">
      <div class="huser"><b id="userNome"></b><span id="userPerfil"></span></div>
      <button class="sair" id="btnSair">Sair</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"><div class="loading">Carregando…</div></main>
</div>

<div class="qr-overlay" id="qrOverlay" onclick="if(event.target===this)fecharQR()">
  <div class="qr-modal">
    <h3>QR Code de rastreabilidade</h3>
    <div class="qr-estab" id="qrEstab"></div>
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-cod" id="qrCod"></div>
    <div class="qr-btns">
      <button onclick="fecharQR()">Fechar</button>
      <a class="baixar" id="qrBaixar" download="qrcode.png">Baixar PNG</a>
    </div>
  </div>
</div>

// ---- seletor de perfil no login (independe do SDK) ----
const descPerfil = {
  estabelecimento: "Opera os dados da própria charcutaria",
  auditor: "Confere e assina documentos de todas",
  administrador: "Cria estabelecimentos e usuários"
};
let perfilEscolhido = "estabelecimento";
document.querySelectorAll("#perfis .perfil-btn").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("#perfis .perfil-btn").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    perfilEscolhido = b.dataset.p;
    document.getElementById("perfilDesc").textContent = descPerfil[perfilEscolhido];
  };
});

// ---- cliente Supabase (protege contra falha de CDN) ----
let sb = null;
if (typeof supabase !== "undefined" && supabase.createClient){
  sb = supabase.createClient(SUPA_URL, SUPA_ANON);
} else {
  document.getElementById("erroLogin").textContent = "Falha ao carregar biblioteca. Verifique a conexão e recarregue.";
}

let perfil = null, meuNome = "", meuEstab = null;

document.getElementById("btnEntrar").onclick = entrar;
document.getElementById("senha").addEventListener("keydown", e=>{ if(e.key==="Enter") entrar(); });
document.getElementById("btnSair").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

async function entrar(){
  if (!sb){ document.getElementById("erroLogin").textContent = "Biblioteca não carregada. Recarregue a página."; return; }
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  const btn = document.getElementById("btnEntrar");
  const erro = document.getElementById("erroLogin");
  erro.textContent = ""; btn.disabled = true; btn.textContent = "ENTRANDO…";
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  btn.disabled = false; btn.textContent = "ENTRAR";
  if (error){ erro.textContent = "E-mail ou senha inválidos."; return; }
  await iniciar();
}

async function iniciar(){
  const { data: { user } } = await sb.auth.getUser();
  const { data: u } = await sb.from("usuario").select("nome,perfil,estabelecimento_id").eq("id", user.id).single();
  if (!u){ document.getElementById("erroLogin").textContent = "Usuário sem perfil cadastrado no sistema."; return; }
  perfil = u.perfil; meuNome = u.nome; meuEstab = u.estabelecimento_id;
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("userNome").textContent = meuNome;
  document.getElementById("userPerfil").textContent = cap(perfil);
  document.getElementById("perfilLabel").textContent = cap(perfil);
  montarNav();
}

function montarNav(){
  let abas;
  if (perfil === "administrador") abas = [["inicio","Início"],["estabelecimentos","Estabelecimentos"],["chancelas","Chancelas"]];
  else if (perfil === "auditor") abas = [["inicio","Início"],["estabelecimentos","Estabelecimentos"],["chancelas","Chancelas"]];
  else abas = [["inicio","Início"],["carcacas","Carcaças"],["estoque","Estoque"],["fichas","Fichas técnicas"],["producao","Produção"],["chancela","Minha chancela"]];
  const nav = document.getElementById("nav");
  nav.innerHTML = abas.map(a=>'<button data-k="'+a[0]+'">'+a[1]+'</button>').join("");
  nav.querySelectorAll("button").forEach(b=> b.onclick = ()=>abrir(b.dataset.k));
  abrir(abas[0][0]);
}
function setOn(k){ document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.k===k)); }

async function abrir(tela){
  setOn(tela);
  const main = document.getElementById("main");
  main.innerHTML = '<div class="loading">Carregando…</div>';
  if (tela==="inicio") return telaInicio(main);
  if (tela==="estabelecimentos") return telaEstab(main);
  if (tela==="chancelas" || tela==="chancela") return telaChancelas(main);
  if (tela==="carcacas") return telaCarcacas(main);
  if (tela==="estoque") return telaEstoque(main);
  if (tela==="fichas") return telaFichas(main);
  if (tela==="producao") return telaProducao(main);
}

async function telaInicio(main){
  if (perfil==="estabelecimento" && meuEstab) return telaInicioEstab(main);
  const [est, cha, pro] = await Promise.all([
    sb.from("estabelecimento").select("id", {count:"exact", head:true}),
    sb.from("chancela").select("status"),
    sb.from("produto").select("id", {count:"exact", head:true}).eq("ativo", true)
  ]);
  const nEst = est.count||0;
  const chas = cha.data||[];
  const ativas = chas.filter(c=>c.status==="ativa").length;
  const suspensas = chas.filter(c=>c.status==="suspensa").length;
  const nPro = pro.count||0;
  let html = '<div class="eyebrow">Visão geral</div><h2>Início</h2><div class="metrics">';
  html += metric(nEst, "Estabelecimentos");
  html += metric(ativas, "Chancelas ativas") + metric(suspensas, "Suspensas") + metric(nPro, "Produtos certificados");
  html += '</div>';
  html += '<div class="eyebrow">Certificação</div><h2 style="font-size:20px">Como funciona</h2>';
  html += '<div class="item"><div><div class="nome">Chancela viva</div><div class="meta">O QR do rótulo consulta o banco toda vez. Suspendeu → o consumidor vê na hora.</div></div></div>';
  main.innerHTML = html;
}

async function telaInicioEstab(main){
  const mes = new Date().toISOString().slice(0,7); // AAAA-MM
  const [car, prods, docs] = await Promise.all([
    sb.from("carcaca").select("peso_carcaca,saldo_kg,data_entrada,codigo,lote,raca").eq("estabelecimento_id",meuEstab).order("data_entrada",{ascending:false}),
    sb.from("producao").select("id,status,data_fabricacao,ficha_id,ficha_tecnica(produto)").eq("estabelecimento_id",meuEstab).order("data_fabricacao",{ascending:false}),
    sb.from("documento_rt").select("id").eq("estabelecimento_id",meuEstab)
  ]);
  const carc = car.data||[];
  const saldo = carc.reduce((s,c)=>s+Number(c.saldo_kg||0),0);
  const recebidoMes = carc.filter(c=>String(c.data_entrada).slice(0,7)===mes).reduce((s,c)=>s+Number(c.peso_carcaca||0),0);
  const utilizado = carc.reduce((s,c)=>s+(Number(c.peso_carcaca||0)-Number(c.saldo_kg||0)),0);
  const producoes = prods.data||[];
  const prodMes = producoes.filter(p=>String(p.data_fabricacao).slice(0,7)===mes).length;
  let html = '<div class="eyebrow">Painel · '+mesNome(mes)+'</div><h2>Resumo do estabelecimento</h2>';
  html += '<div class="metrics">'+
    metricCor(saldo.toFixed(2)+' <small>kg</small>', "Saldo em estoque", "moss")+
    metric(recebidoMes.toFixed(2)+' <small>kg</small>', "Recebido no mês")+
    metricCor(utilizado.toFixed(2)+' <small>kg</small>', "Utilizado", "cure")+
    metric(prodMes+' <small>docs</small>', "Produções do mês")+
  '</div>';
  // últimas carcaças e produções
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px" class="grid-resumo">';
  html += '<div class="painel-card"><div class="painel-titulo">Últimas carcaças</div>';
  if (!carc.length) html += '<div class="meta">Nenhuma carcaça registrada.</div>';
  carc.slice(0,3).forEach(c=>{
    html += '<div class="linha-mini"><div><div class="nome" style="font-size:14px">'+esc(c.codigo)+'</div><div class="meta">'+(c.lote?'lote '+esc(c.lote):(c.raca||"—"))+'</div></div><div class="mono" style="color:var(--cure)">'+Number(c.peso_carcaca).toFixed(1)+' kg</div></div>';
  });
  html += '</div>';
  html += '<div class="painel-card"><div class="painel-titulo">Últimas produções</div>';
  if (!producoes.length) html += '<div class="meta">Nenhuma produção registrada.</div>';
  producoes.slice(0,3).forEach(p=>{
    const st = statusProducao(p.status);
    html += '<div class="linha-mini"><div><div class="nome" style="font-size:14px">'+esc(p.ficha_tecnica?p.ficha_tecnica.produto:"—")+'</div><div class="meta">'+fmt(p.data_fabricacao)+'</div></div><span class="tag '+st.classe+'">'+st.rotulo+'</span></div>';
  });
  html += '</div></div>';
  main.innerHTML = html;
}
function mesNome(m){ const n=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"]; const p=m.split("-"); return n[parseInt(p[1])-1]+" "+p[0]; }
function metricCor(v,l,cor){ return '<div class="metric '+cor+'"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
function statusProducao(s){
  if (s==="aprovado") return {classe:"ativa", rotulo:"Aprovado"};
  if (s==="aguardando") return {classe:"processo", rotulo:"Aguardando auditoria"};
  if (s==="em_correcao") return {classe:"suspensa", rotulo:"Em correção"};
  if (s==="reprovado") return {classe:"suspensa", rotulo:"Reprovado"};
  return {classe:"processo", rotulo:"Rascunho"};
}
function metric(v,l){ return '<div class="metric"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }

async function salvarEstab(){
  const nome = document.getElementById("f_nome").value.trim();
  const doc = document.getElementById("f_doc").value.trim();
  const cidade = document.getElementById("f_cidade").value.trim();
  const sim = document.getElementById("f_sim").value.trim();
  const email = document.getElementById("f_email").value.trim();
  const loginRaw = document.getElementById("f_login").value.trim();
  const senha = document.getElementById("f_senha").value;
  const login = loginRaw || email; // se login vazio, usa o e-mail do estabelecimento
  const msg = document.getElementById("formMsg");
  const btn = document.getElementById("btnSalvar");
  msg.className=""; msg.textContent="";
  if (!nome){ msg.className="msg-erro"; msg.textContent="Informe o nome do estabelecimento."; return; }
  if (!doc){ msg.className="msg-erro"; msg.textContent="Informe o CPF ou CNPJ."; return; }
  const querLogin = (login.length>0 || senha.length>0);
  if (querLogin){
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(login)){ msg.className="msg-erro"; msg.textContent="Para criar acesso, informe um e-mail de login válido."; return; }
    if (senha.length<8){ msg.className="msg-erro"; msg.textContent="A senha deve ter no mínimo 8 caracteres."; return; }
  }
  btn.disabled=true; btn.textContent="SALVANDO…";
  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess?.session?.access_token;
    const resp = await fetch(SUPA_URL+"/functions/v1/cadastrar-estab", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token, "apikey":SUPA_ANON },
      body: JSON.stringify({ nome, documento:doc, cidade, sim_poa:sim, email, senha: querLogin?senha:"", login: querLogin?login:"" })
    });
    const out = await resp.json();
    btn.disabled=false; btn.textContent="CADASTRAR ESTABELECIMENTO";
    if (!resp.ok){ msg.className="msg-erro"; msg.textContent = out.error || "Erro ao cadastrar."; return; }
    msg.className="msg-ok";
    msg.textContent = "✓ "+out.estabelecimento.nome+" cadastrado"+(out.login?" com acesso":"")+(out.chancela&&out.chancela.codigo?" · chancela "+out.chancela.codigo+" (em processo)":"")+"! Redirecionando…";
    setTimeout(()=>abrir("estabelecimentos"), 1400);
  }catch(e){
    btn.disabled=false; btn.textContent="CADASTRAR ESTABELECIMENTO";
    msg.className="msg-erro"; msg.textContent="Erro de conexão: "+e.message;
  }
}

      '</div>'+

    if (podeGerir){
      html += '<select class="status-sel" onchange="mudarStatus(\''+c.id+'\',this.value,this)">'+
        '<option value="ativa"'+(c.status==="ativa"?" selected":"")+'>Ativa</option>'+

        '<option value="suspensa"'+(c.status==="suspensa"?" selected":"")+'>Suspensa</option>'+

function statusInfo(s){
  if (s==="ativa") return {classe:"ativa", rotulo:"Ativa", borda:"moss"};
  if (s==="em_processo") return {classe:"processo", rotulo:"Em processo", borda:"gold"};
  return {classe:"suspensa", rotulo:"Suspensa", borda:"gold"};
}

async function mudarStatus(id, novo, sel){
  sel.disabled = true;
  const { error } = await sb.from("chancela").update({ status: novo }).eq("id", id);

  if (error){ alert("Erro ao mudar status: "+error.message); return; }

async function emitirChancela(){
  const estab = document.getElementById("ec_estab").value;

  msg.className=""; msg.textContent="";
  btn.disabled=true; btn.textContent="EMITINDO…";

  const ano = new Date().getFullYear();

    .insert({ estabelecimento_id: estab, status: status, auditado_em: auditado, validade: validade, codigo: 'RM-'+ano+'-TEMP', numero: 0 })

  msg.className="msg-ok";

  setTimeout(()=>abrir("chancelas"), 1300);
}

        '<option value="">— selecione —</option><option value="sim">Sim</option><option value="nao">Não</option></select>'+
      '<label>Promotor de crescimento</label><select class="status-sel" id="c_promotor" style="width:100%;padding:12px 14px;font-size:14px">'+
        '<option value="">— selecione —</option><option value="sim">Sim</option><option value="nao">Não</option></select>'+
      '<label>Grau de Bem-Estar Animal</label><select class="status-sel" id="c_bemestar" style="width:100%;padding:12px 14px;font-size:14px">'+
        '<option value="">— selecione —</option><option value="A">A (excelente)</option><option value="B">B (bom)</option><option value="C">C (regular)</option><option value="D">D (mínimo)</option></select>'+
      '<label>Frigorífico</label><input id="c_frigorifico" placeholder="Frigorífico ..."/>'+
      '<label>Data de entrada</label><input id="c_data" type="date"/>'+
      '<button class="btn-salvar" id="btnC" onclick="salvarCarcaca()">REGISTRAR CARCAÇA</button>'+
      '<div id="cMsg"></div></div>';
  document.getElementById("c_data").value = new Date().toISOString().slice(0,10);
}
async function salvarCarcaca(){
  const peso = parseFloat(document.getElementById("c_peso").value);
  const msg = document.getElementById("cMsg"); const btn=document.getElementById("btnC");
  msg.className=""; msg.textContent="";
  if (!peso || peso<=0){ msg.className="msg-erro"; msg.textContent="Informe um peso de carcaça válido."; return; }
  btn.disabled=true; btn.textContent="SALVANDO…";
  const ano = new Date().getFullYear(); const mm = String(new Date().getMonth()+1).padStart(2,"0");
  const conf = document.getElementById("c_confinamento").value;
  const prom = document.getElementById("c_promotor").value;
  const rec = {
    estabelecimento_id: meuEstab,
    codigo: 'CAR-'+ano+mm+'-TEMP',
    peso_carcaca: peso,
    saldo_kg: peso,
    lote: document.getElementById("c_lote").value.trim()||null,
    tatuagem: document.getElementById("c_tatuagem").value.trim()||null,
    raca: document.getElementById("c_raca").value||"Moura",
    data_nascimento: document.getElementById("c_nascimento").value||null,
    confinamento: conf==="sim"?true:(conf==="nao"?false:null),
    promotor_crescimento: prom==="sim"?true:(prom==="nao"?false:null),
    bem_estar: document.getElementById("c_bemestar").value||null,
    frigorifico: document.getElementById("c_frigorifico").value.trim()||null,
    data_entrada: document.getElementById("c_data").value||new Date().toISOString().slice(0,10)
  };
  const { error } = await sb.from("carcaca").insert(rec);
  btn.disabled=false; btn.textContent="REGISTRAR CARCAÇA";
  if (error){ msg.className="msg-erro"; msg.textContent="Erro: "+error.message; return; }
  msg.className="msg-ok"; msg.textContent="✓ Carcaça registrada! Redirecionando…";
  setTimeout(()=>abrir("carcacas"), 1200);
}

// ==================== ESTOQUE ====================
async function telaEstoque(main){
  const { data, error } = await sb.from("carcaca").select("*").eq("estabelecimento_id",meuEstab).gt("saldo_kg",0).order("data_entrada");
  if (error){ main.innerHTML='<div class="loading">Erro: '+error.message+'</div>'; return; }
  const total = (data||[]).reduce((s,c)=>s+Number(c.saldo_kg),0);
  let html = '<div class="eyebrow">Disponível · kg</div><h2>Estoque de carcaças</h2>'+
    '<div class="metrics"><div class="metric moss"><div class="v">'+total.toFixed(2)+' <small>kg</small></div><div class="l">Saldo total disponível</div></div>'+
    '<div class="metric"><div class="v">'+(data||[]).length+'</div><div class="l">Carcaças com saldo</div></div></div>';
  if (!data.length) html += '<div class="vazio">Sem saldo em estoque. Registre uma carcaça primeiro.</div>';
  data.forEach(c=>{
    const pct = (Number(c.saldo_kg)/Number(c.peso_carcaca)*100).toFixed(0);
    html += '<div class="item moss"><div><div class="nome">'+esc(c.codigo)+'</div><div class="meta">'+(c.lote?'lote '+esc(c.lote):(c.raca||"—"))+' · entrada '+fmt(c.data_entrada)+' · original '+Number(c.peso_carcaca).toFixed(1)+' kg</div></div>'+
      '<div style="text-align:right"><div class="mono" style="color:var(--moss);font-size:16px">'+Number(c.saldo_kg).toFixed(1)+' kg</div><div class="meta" style="font-size:11px">'+pct+'% restante</div></div></div>';
  });
  main.innerHTML = html;
}

// ==================== FICHAS TÉCNICAS ====================
async function telaFichas(main){
  const { data, error } = await sb.from("ficha_tecnica").select("*").eq("estabelecimento_id",meuEstab).order("produto");
  if (error){ main.innerHTML='<div class="loading">Erro: '+error.message+'</div>'; return; }
  let html = '<div class="topbar"><div><div class="eyebrow">Receitas · produtos</div><h2 style="margin-bottom:0">Fichas técnicas</h2></div>'+
    '<button class="btn-novo" onclick="telaNovaFicha()">+ Nova ficha</button></div><div style="height:22px"></div>';
  if (!data.length) html += '<div class="vazio">Nenhuma ficha técnica cadastrada.</div>';
  data.forEach(f=>{
    html += '<div class="item"><div><div class="nome">'+esc(f.produto)+'</div><div class="meta">'+
      (f.rendimento?'rendimento '+f.rendimento+'% · ':'')+(f.pct_carne?'carne '+f.pct_carne+'% · ':'')+(f.pct_gordura?'gordura '+f.pct_gordura+'% · ':'')+
      (f.validade?'validade '+esc(f.validade):'')+'</div></div>'+
      '<span class="tag '+(f.ativo?'ativa':'suspensa')+'">'+(f.ativo?'Ativa':'Inativa')+'</span></div>';
  });

}
function telaNovaFicha(){

  main.innerHTML = '<button class="btn-link" onclick="abrir(\'fichas\')">← Voltar às fichas</button>'+
    '<div class="eyebrow">Nova receita</div><h2>Nova ficha técnica</h2>'+
    '<div class="form-card">'+
      '<label>Nome do produto *</label><input id="f_produto" placeholder="Salame Colonial Moura"/>'+
      '<label>Unidade</label><input id="f_unidade" placeholder="kg / peça"/>'+
      '<label>Validade</label><input id="f_validade" placeholder="90 dias"/>'+
      '<label>Rendimento (%)</label><input id="f_rend" type="number" step="0.1" placeholder="70"/>'+
      '<label>% Carne</label><input id="f_carne" type="number" step="0.1" placeholder="80"/>'+
      '<label>% Gordura</label><input id="f_gord" type="number" step="0.1" placeholder="20"/>'+
      '<label>% Outros</label><input id="f_outros" type="number" step="0.1" placeholder="0"/>'+

// ==================== PRODUÇÃO ====================
async function telaProducao(main){
  const { data, error } = await sb.from("producao").select("*,ficha_tecnica(produto)").eq("estabelecimento_id",meuEstab).order("data_fabricacao",{ascending:false});
  if (error){ main.innerHTML='<div class="loading">Erro: '+error.message+'</div>'; return; }
  let html = '<div class="topbar"><div><div class="eyebrow">Fabricação · rastreabilidade</div><h2 style="margin-bottom:0">Produção</h2></div>'+
    '<button class="btn-novo" onclick="telaNovaProducao()">+ Nova produção</button></div><div style="height:22px"></div>';
  if (!data.length) html += '<div class="vazio">Nenhuma produção registrada ainda.</div>';
  data.forEach(p=>{
    const st = statusProducao(p.status);
    html += '<div class="item"><div><div class="nome">'+esc(p.ficha_tecnica?p.ficha_tecnica.produto:"—")+(p.lote?'  ·  lote '+esc(p.lote):'')+'</div>'+
      '<div class="meta">fabricado '+fmt(p.data_fabricacao)+(p.qtd_produzida?' · '+p.qtd_produzida+' un/kg':'')+'</div></div>'+
      '<span class="tag '+st.classe+'">'+st.rotulo+'</span></div>';
  });
  main.innerHTML = html;
}
async function telaNovaProducao(){
  const main = document.getElementById("main");
  main.innerHTML = '<div class="loading">Carregando fichas e estoque…</div>';
  const [fichas, carcacas] = await Promise.all([
    sb.from("ficha_tecnica").select("id,produto").eq("estabelecimento_id",meuEstab).eq("ativo",true).order("produto"),
    sb.from("carcaca").select("id,codigo,saldo_kg,lote").eq("estabelecimento_id",meuEstab).gt("saldo_kg",0).order("data_entrada")
  ]);
  const fs = fichas.data||[]; const cs = carcacas.data||[];
  if (!fs.length){ main.innerHTML='<button class="btn-link" onclick="abrir(\'producao\')">← Voltar</button><div class="vazio">Cadastre uma ficha técnica antes de produzir.</div>'; return; }
  if (!cs.length){ main.innerHTML='<button class="btn-link" onclick="abrir(\'producao\')">← Voltar</button><div class="vazio">Sem carcaças em estoque. Registre uma carcaça antes de produzir.</div>'; return; }
  let html = '<button class="btn-link" onclick="abrir(\'producao\')">← Voltar à produção</button>'+
    '<div class="eyebrow">Nova fabricação</div><h2>Nova produção</h2>'+
    '<div class="form-card">'+
      '<label>Produto (ficha técnica) *</label><select class="status-sel" id="p_ficha" style="width:100%;padding:12px 14px;font-size:14px">'+
      fs.map(f=>'<option value="'+f.id+'">'+esc(f.produto)+'</option>').join("")+'</select>'+
      '<label>Lote</label><input id="p_lote" placeholder="L-'+new Date().getFullYear()+'-001"/>'+
      '<label>Data de fabricação</label><input id="p_data" type="date"/>'+
      '<label>Quantidade produzida (un/kg)</label><input id="p_qtd" type="number" step="0.01" placeholder="0"/>'+
      '<div class="acesso-bloco"><div class="acesso-titulo">Carcaças utilizadas</div>'+
      '<div class="acesso-desc">Marque as carcaças e informe quantos kg de cada uma foram usados nesta produção. O estoque baixa automaticamente.</div>'+
      cs.map(c=>'<div class="carc-linha"><label style="display:flex;align-items:center;gap:8px;margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)"><input type="checkbox" class="p_carc" data-id="'+c.id+'" data-saldo="'+c.saldo_kg+'" style="width:auto" onchange="toggleCarc(this)"/> '+esc(c.codigo)+' <span class="meta">('+Number(c.saldo_kg).toFixed(1)+' kg disp.)</span></label>'+
        '<input type="number" step="0.01" class="p_kg" data-id="'+c.id+'" placeholder="kg usados" disabled style="width:120px;padding:8px"/></div>').join("")+
      '</div>'+
      '<button class="btn-salvar" id="btnP" onclick="salvarProducao()">REGISTRAR PRODUÇÃO</button>'+
      '<div id="pMsg"></div></div>';
  main.innerHTML = html;
  document.getElementById("p_data").value = new Date().toISOString().slice(0,10);
}
function toggleCarc(chk){
  const kg = document.querySelector('.p_kg[data-id="'+chk.dataset.id+'"]');
  kg.disabled = !chk.checked;
  if (!chk.checked) kg.value="";
  else kg.focus();
}
async function salvarProducao(){
  const ficha = document.getElementById("p_ficha").value;
  const msg=document.getElementById("pMsg"); const btn=document.getElementById("btnP");
  msg.className=""; msg.textContent="";
  // coletar carcaças marcadas
  const usos = [];
  document.querySelectorAll(".p_carc:checked").forEach(chk=>{
    const kg = parseFloat(document.querySelector('.p_kg[data-id="'+chk.dataset.id+'"]').value);
    const saldo = parseFloat(chk.dataset.saldo);
    usos.push({ carcaca_id: chk.dataset.id, kg, saldo });
  });
  if (!usos.length){ msg.className="msg-erro"; msg.textContent="Selecione ao menos uma carcaça."; return; }
  for (const u of usos){
    if (!u.kg || u.kg<=0){ msg.className="msg-erro"; msg.textContent="Informe os kg usados de cada carcaça marcada."; return; }
    if (u.kg > u.saldo){ msg.className="msg-erro"; msg.textContent="Uma carcaça não tem saldo suficiente ("+u.kg+" > "+u.saldo+" kg)."; return; }
  }
  btn.disabled=true; btn.textContent="SALVANDO…";
  // 1) criar producao
  const { data: prod, error: e1 } = await sb.from("producao").insert({
    estabelecimento_id: meuEstab, ficha_id: ficha,
    lote: document.getElementById("p_lote").value.trim()||null,
    data_fabricacao: document.getElementById("p_data").value||new Date().toISOString().slice(0,10),
    qtd_produzida: parseFloat(document.getElementById("p_qtd").value)||null,
    status: "aguardando"
  }).select("id").single();
  if (e1){ btn.disabled=false; btn.textContent="REGISTRAR PRODUÇÃO"; msg.className="msg-erro"; msg.textContent="Erro: "+e1.message; return; }
  // 2) inserir consumos (trigger baixa o saldo)
  const consumos = usos.map(u=>({ producao_id: prod.id, carcaca_id: u.carcaca_id, kg_utilizado: u.kg }));
  const { error: e2 } = await sb.from("consumo_carcaca").insert(consumos);
  if (e2){
    await sb.from("producao").delete().eq("id", prod.id); // desfaz
    btn.disabled=false; btn.textContent="REGISTRAR PRODUÇÃO";
    msg.className="msg-erro"; msg.textContent = /saldo/i.test(e2.message)?"Saldo insuficiente em uma carcaça.":"Erro ao baixar estoque: "+e2.message;
    return;
  }
  btn.disabled=false; btn.textContent="REGISTRAR PRODUÇÃO";
  msg.className="msg-ok"; msg.textContent="✓ Produção registrada e estoque baixado! Redirecionando…";
  setTimeout(()=>abrir("producao"), 1400);
}

function verQR(codigo, nomeEstab){
  const url = SITE_URL + "/verifica.html?c=" + encodeURIComponent(codigo);
  const box = document.getElementById("qrBox");
  box.innerHTML = "";
  document.getElementById("qrEstab").textContent = nomeEstab || "";
  document.getElementById("qrCod").textContent = codigo;
  // gerar QR
  new QRCode(box, { text: url, width: 200, height: 200, colorDark: "#100D0B", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  // preparar botão baixar (pega o canvas/img gerado)
  setTimeout(()=>{
    const cv = box.querySelector("canvas");
    const img = box.querySelector("img");
    const dataUrl = cv ? cv.toDataURL("image/png") : (img ? img.src : "");
    const bt = document.getElementById("qrBaixar");
    bt.href = dataUrl;
    bt.download = "qr-" + codigo + ".png";
  }, 250);
  document.getElementById("qrOverlay").classList.add("on");
}
function fecharQR(){ document.getElementById("qrOverlay").classList.remove("on"); }

function esc(s){ return String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : ""; }
function fmt(d){ if(!d) return "—"; const p=String(d).split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : d; }

if (sb) sb.auth.getSession().then(r=>{ if (r.data.session) iniciar(); });
</script>
