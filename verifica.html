<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#100D0B;color:#F2E6CE;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:420px;width:100%;text-align:center}
.selo-wrap{position:relative;width:150px;margin:0 auto 20px}.selo-wrap img{width:100%;display:block;border-radius:8px}
.selo-num{position:absolute;left:50.1%;top:84.1%;transform:translate(-50%,-50%);font-family:'Playfair Display',Georgia,serif;font-weight:800;color:#141414;font-size:26px;line-height:1}
.marca{color:#C9A34E;font-weight:800;letter-spacing:2px;font-size:18px;margin-bottom:4px}
.sub{color:#9A8B72;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:32px}
.painel{background:#191410;border:1px solid #2E2620;border-radius:12px;padding:32px 24px}
.estab{font-size:22px;font-weight:700;margin-bottom:6px}
.local{color:#9A8B72;font-size:13px;margin-bottom:24px;font-family:'DM Mono',monospace}
.status{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:40px;font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase}
.ativa{background:rgba(201,163,78,.15);color:#E0C067;border:1px solid #C9A34E}
.dot{width:12px;height:12px;border-radius:50%;background:#E0C067}
.produtos{margin-top:26px;padding-top:22px;border-top:1px solid #2E2620}
.produtos-titulo{font-family:'DM Mono',monospace;font-size:11px;color:#C9A34E;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
.produto{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0;border-bottom:1px dotted #2E2620;text-align:center}
.produto:last-child{border-bottom:none}
.produto-dot{width:7px;height:7px;border-radius:50%;background:#C9A34E;flex-shrink:0}
.produto-nome{font-size:15px;font-weight:600;color:#F2E6CE}
.bemestar{margin-top:22px;padding-top:20px;border-top:1px solid #2E2620;display:flex;flex-direction:column;align-items:center;gap:8px}
.bemestar-label{font-family:'DM Mono',monospace;font-size:11px;color:#C9A34E;text-transform:uppercase;letter-spacing:1.5px}
.bemestar-grau{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;border:2px solid #C9A34E;background:rgba(201,163,78,.12);color:#E0C067;font-family:'Playfair Display',serif;font-weight:800;font-size:24px}
.chancela{font-family:'DM Mono',monospace;font-size:13px;color:#9A8B72;margin-top:20px}
.verificado{font-size:11px;color:#9A8B72;margin-top:8px}
.rodape{font-family:'DM Mono',monospace;font-size:10.5px;color:#6B6357;margin-top:24px;line-height:1.6}
.erro{color:#C9A34E;font-family:'DM Mono',monospace;font-size:13px;padding:40px;line-height:1.6}
.indisp-icone{font-size:44px;margin-bottom:16px;opacity:.7}
.indisp-texto{color:#9A8B72;font-size:14px;line-height:1.6;margin:16px 0 8px;font-family:'DM Mono',monospace}
.loading{color:#9A8B72;font-family:'DM Mono',monospace;font-size:13px;padding:40px}
</style></head>

function params(){const u=new URL(location.href);return u.searchParams.get("c")||"";}
async function init(){
  const codigo=params();
  const card=document.getElementById("card");
  if(!codigo){card.innerHTML='<div class="erro">Código não informado.</div>';return;}
  const sb=supabase.createClient(SUPA_URL,SUPA_ANON);
  const {data,error}=await sb.from("v_chancela_publica").select("*").eq("codigo",codigo).maybeSingle();
  if(error||!data){card.innerHTML='<div class="marca">ÓRIGO</div><div class="sub">Verificação de chancela</div><div class="painel"><div class="erro">Chancela '+esc(codigo)+' não encontrada.</div></div>';return;}
  // REGRA: só mostra certificação/produtos quando ATIVA. Suspensa e em_processo = indisponível.
  if(data.status!=="ativa"){
    card.innerHTML='<div class="marca">ÓRIGO</div><div class="sub">Verificação de chancela</div>'+
      '<div class="painel"><div class="indisp-icone">&#9888;</div>'+
      '<div class="estab">Certificação indisponível</div>'+
      '<div class="indisp-texto">Este estabelecimento não possui chancela ativa no momento. A certificação pode estar em processo de auditoria ou suspensa. Nenhum produto certificado está disponível para exibição.</div>'+
      '<div class="chancela">Chancela '+esc(codigo)+'</div>'+
      '<div class="verificado">Verificado em tempo real</div></div>'+
      '<div class="rodape">Rastreabilidade e certificação de origem<br/>Emitido pela BIOTEC Consultoria</div>';
    return;
  }
  // ATIVA: selo + todos os produtos. Se tem carcaça Moura, o selo Moura substitui o Órigo.
  const seloUsado = data.tem_moura ? SELO_MOURA : SELO;
  let prods="";
  if(Array.isArray(data.produtos)&&data.produtos.length){
    prods='<div class="produtos"><div class="produtos-titulo">Produtos certificados</div>'+
      data.produtos.map(p=>'<div class="produto"><span class="produto-nome">'+esc(p.nome)+'</span></div>').join("")+
      '</div>';
  }
  card.innerHTML='<div class="selo-wrap"><img src="'+seloUsado+'" alt="Selo"/><div class="selo-num">'+esc(String(data.numero))+'</div></div>'+
    '<div class="marca">ÓRIGO</div><div class="sub">Verificação de chancela</div>'+
    '<div class="painel"><div class="estab">'+esc(data.estabelecimento)+'</div>'+
    '<div class="local">'+esc(data.cidade||"")+'</div>'+
    '<div class="status ativa"><span class="dot"></span>Chancela ativa</div>'+
    prods+
    (data.bem_estar ? '<div class="bemestar"><span class="bemestar-label">Grau de bem-estar animal</span><span class="bemestar-grau">'+esc(data.bem_estar)+'</span></div>' : '')+
    '<div class="chancela">Chancela '+esc(data.codigo)+'</div>'+
    '<div class="verificado">Verificado em tempo real</div></div>'+
    '<div class="rodape">Rastreabilidade e certificação de origem<br/>Emitido pela BIOTEC Consultoria</div>';
}
window.addEventListener("load",init);
</script>
</body></html>
